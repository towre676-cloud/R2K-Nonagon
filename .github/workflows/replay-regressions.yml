name: Focused replay regressions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        optimize: ['0', '1']
    env:
      PYTHONOPTIMIZE: ${{ matrix.optimize }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded replay dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 python-flint==0.9.0
      - name: Restore and verify bundled compressed evidence
        run: python restore_evidence.py
      - name: Run adversarial controls and relocated IEEE-118 replay
        run: python -m unittest discover -s tests -v
      - name: Ensure historical tracked receipts remain unchanged
        run: git diff --exit-code
